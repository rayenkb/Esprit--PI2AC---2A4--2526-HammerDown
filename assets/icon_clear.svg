<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Eraser/Clear icon in gold-brown theme (#8B6F47) -->
  <!-- Eraser body (rotated rectangle) -->
  <g transform="translate(32,32) rotate(-45) translate(-32,-32)">
    <!-- Eraser body -->
    <rect x="16" y="22" width="32" height="20" rx="3" ry="3" fill="#8B6F47" opacity="0.9"/>
    <!-- Eraser tip (rubber part) -->
    <rect x="16" y="22" width="12" height="20" rx="3" ry="0" fill="#A0825A"/>
    <!-- Line detail on eraser -->
    <line x1="28" y1="22" x2="28" y2="42" stroke="#7a5f3c" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Small sparkle/clean marks -->
  <line x1="14" y1="10" x2="14" y2="18" stroke="#8B6F47" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="14" x2="18" y2="14" stroke="#8B6F47" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="46" x2="50" y2="52" stroke="#8B6F47" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="47" y1="49" x2="53" y2="49" stroke="#8B6F47" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
